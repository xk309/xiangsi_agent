services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
    env_file: .env
    environment:
      MCP_SERVER_URL: http://mcp-server:8010/mcp
      WEATHER_FILE: /data/weather.nc
      PGHOST: ${DOCKER_PGHOST:-host.docker.internal}
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ${WEATHER_HOST_PATH:-../数据处理与建表/mock_qixiang/synthetic_meteorology_20250101_20251231.nc}:/data/weather.nc:ro
      - agent-runs:/app/.runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      mcp-server:
        condition: service_started
    restart: unless-stopped

  mcp-server:
    build:
      context: .
    env_file: .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8010
      PGHOST: ${DOCKER_PGHOST:-host.docker.internal}
    command: python -m mcp_server.server
    restart: unless-stopped

  prefect-server:
    profiles: ["platform"]
    build:
      context: .
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_URL: http://127.0.0.1:4200/api
      PREFECT_HOME: /root/.prefect
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - prefect-data:/root/.prefect
    restart: unless-stopped

  prefect-worker:
    profiles: ["platform"]
    build:
      context: .
    env_file: .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_HOME: /root/.prefect
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    command: >-
      sh -c "prefect work-pool create --type process data-ingestion || true;
      prefect deploy --all;
      prefect worker start --pool data-ingestion"
    depends_on:
      - prefect-server
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.0
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  agent-runs:
  prefect-data:
  grafana-data:
